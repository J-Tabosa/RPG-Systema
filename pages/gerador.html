<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de Personagens — RPG System</title>
<link rel="stylesheet" href="../css/base.css">
<style>
body{display:flex;flex-direction:column;min-height:100vh}
#app{display:flex;flex-direction:column;flex:1}

/* LAYOUT */
.gen-workspace{display:flex;flex:1;overflow:hidden;height:calc(100vh - 52px)}
.gen-panel{width:290px;flex-shrink:0;border-right:1px solid var(--border);background:#120f0a;overflow-y:auto;padding:14px}
body.light .gen-panel{background:#e0d8c4}
.gen-main{flex:1;overflow-y:auto;padding:24px 28px}

/* FILTER PANEL */
.filter-group{margin-bottom:12px}
.filter-group label{display:block;font-family:'Cinzel',serif;font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.filter-group select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:4px;font-family:'Crimson Text',serif;font-size:13px;cursor:pointer}
.filter-group select:focus{outline:none;border-color:var(--gold)}
.filter-group select option{background:var(--card)}
.gen-btn{width:100%;margin-top:4px;font-size:12px;padding:9px;letter-spacing:1.5px}

/* PRESET SELECTOR */
.preset-box{background:rgba(200,168,107,0.05);border:1px dashed var(--border);border-radius:5px;padding:10px;margin-bottom:16px}
.preset-box label{display:block;font-family:'Cinzel',serif;font-size:9px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.preset-box select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:4px;font-family:'Cinzel',serif;font-size:10px;cursor:pointer;font-weight:700}
.preset-box select:focus{outline:none;border-color:var(--gold)}

/* RESULT */
.result-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);font-style:italic;gap:12px;min-height:300px}
.result-empty .big{font-size:48px;opacity:0.2}
.result-empty p{font-size:14px;text-align:center;max-width:280px;line-height:1.6}

/* NPC SHEET */
.npc-sheet{max-width:820px;margin:0 auto}
.actions-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;align-items:center}
.actions-bar .btn{flex:1;min-width:110px;text-align:center}

.npc-header{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 22px;margin-bottom:14px;display:flex;align-items:center;gap:18px}
.npc-avatar{width:68px;height:68px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:26px;font-weight:700;color:var(--gold);background:rgba(200,168,107,0.08);flex-shrink:0}
.npc-identity{flex:1}
.npc-name{font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:var(--gold2);margin-bottom:4px}
.npc-sub{font-size:13px;color:var(--muted);margin-bottom:6px}
.npc-tags{display:flex;gap:5px;flex-wrap:wrap}
.npc-tag{font-family:'Cinzel',serif;font-size:9px;padding:2px 7px;border-radius:3px;border:1px solid;letter-spacing:0.5px;text-transform:uppercase}
.npc-tag.raca{border-color:var(--blue2);color:var(--blue2)}
.npc-tag.classe{border-color:var(--gold);color:var(--gold)}
.npc-tag.prof{border-color:var(--green2);color:var(--green2)}
.npc-tag.nivel{border-color:var(--muted);color:var(--muted)}

.npc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.npc-sec{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:13px 15px}
.npc-sec-full{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:13px 15px;margin-bottom:12px}
.npc-sec h3{font-family:'Cinzel',serif;font-size:10px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}

.attr-row{display:flex;gap:6px;flex-wrap:wrap}
.attr-mini{background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:6px 8px;text-align:center;flex:1;min-width:56px}
.attr-mini-lbl{font-family:'Cinzel',serif;font-size:8px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.attr-mini-val{font-family:'Cinzel',serif;font-size:17px;font-weight:700;color:var(--text)}
.attr-mini-mod{font-size:10px;color:var(--muted);font-family:'Cinzel',serif}

.trait-list{list-style:none;padding:0}
.trait-list li{font-size:12px;color:var(--muted);padding:3px 0 3px 14px;position:relative;line-height:1.5;border-bottom:1px solid rgba(61,51,32,0.25)}
.trait-list li:last-child{border-bottom:none}
.trait-list li::before{content:'◆';position:absolute;left:0;color:var(--border);font-size:7px;top:7px}
.trait-list li strong{color:var(--text)}

.combat-row{display:flex;gap:8px;flex-wrap:wrap}
.cs-box{background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:7px 10px;text-align:center;flex:1;min-width:58px}
.cs-val{font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:var(--gold)}
.cs-lbl{font-size:9px;color:var(--muted);font-family:'Cinzel',serif;letter-spacing:0.5px;text-transform:uppercase}

/* SAVE MODAL */
.folder-pick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px}
.folder-opt{padding:10px 6px;border-radius:5px;border:1px solid var(--border);background:var(--card2);cursor:pointer;text-align:center;transition:all 0.15s;font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.5px;color:var(--muted);text-transform:uppercase}
.folder-opt:hover{border-color:var(--gold);color:var(--gold)}
.folder-opt.sel{border-color:var(--gold);color:var(--gold);background:rgba(200,168,107,0.1)}
.folder-opt i{display:block;font-size:20px;margin-bottom:4px}

/* PRINT */
@media print{
  .header,.gen-panel,.actions-bar,.no-print{display:none!important}
  .gen-workspace{height:auto;display:block}
  .gen-main{padding:0;overflow:visible}
  .npc-sheet{max-width:100%}
  body{background:#fff;color:#000}
  :root{--bg:#fff;--card:#f5f5f5;--card2:#ececec;--border:#ccc;--text:#111;--muted:#555;--gold:#6a4e10;--gold2:#4a3000}
  .npc-header,.npc-sec,.npc-sec-full,.npc-grid{break-inside:avoid}
}

/* RESPONSIVE */
@media(max-width:700px){
  .gen-workspace{flex-direction:column;height:auto}
  .gen-panel{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:none}
  .gen-main{padding:14px 16px}
  .npc-grid{grid-template-columns:1fr}
  .npc-header{flex-direction:column;text-align:center}
  .npc-tags{justify-content:center}
  .actions-bar{flex-direction:column}
  .actions-bar .btn{min-width:0}
  .folder-pick{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app">

  <div class="header">
    <div class="header-brand">
      <i class="ti ti-sparkles header-icon"></i>
      <div><h1>Gerador de Personagens</h1><div class="subtitle">NPCs e Jogadores Aleatórios</div></div>
    </div>
    <div class="header-actions">
      <a href="../index.html"   class="nav-link"><i class="ti ti-home"></i> Início</a>
      <a href="ficha.html"      class="nav-link"><i class="ti ti-scroll"></i> Fichas</a>
      <a href="gerador.html"    class="nav-link active"><i class="ti ti-sparkles"></i> Gerador</a>
      <a href="conteudo.html"   class="nav-link"><i class="ti ti-database"></i> Conteúdo</a>
      <a href="tracker.html"    class="nav-link"><i class="ti ti-sword"></i> Tracker</a>
      <button class="theme-icon-btn" id="themeBtn" onclick="toggleTheme()" title="Alternar tema">☀</button>
      <button class="mob-menu-btn" id="mobMenuBtn" onclick="toggleMobMenu()" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
    </div>
    <nav class="mob-nav" id="mobNav">
      <a href="../index.html" class="nav-link" onclick="closeMobMenu()"><i class="ti ti-home"></i> Início</a>
      <a href="ficha.html"    class="nav-link" onclick="closeMobMenu()"><i class="ti ti-scroll"></i> Fichas</a>
      <a href="gerador.html"    class="nav-link" onclick="closeMobMenu()"><i class="ti ti-sparkles"></i> Gerador</a>
      <a href="conteudo.html"   class="nav-link" onclick="closeMobMenu()"><i class="ti ti-database"></i> Conteúdo</a>
      <a href="tracker.html"  class="nav-link" onclick="closeMobMenu()"><i class="ti ti-sword"></i> Tracker</a>
    </nav>
  </div>

  <div class="gen-workspace">

    <div class="gen-panel">
      
      <div class="preset-box">
        <label><i class="ti ti-layout-grid-add"></i> Preset de Campanha</label>
        <select id="presetSelector" onchange="alterarPresetAtivo(this.value)">
          <option value="default">Padrão (Todo Conteúdo)</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Raça</label>
        <select id="fRaca"><option value="">Aleatória</option></select>
      </div>
      <div class="filter-group">
        <label>Classe</label>
        <select id="fClasse"><option value="">Aleatória</option></select>
      </div>
      <div class="filter-group">
        <label>Profissão</label>
        <select id="fProf"><option value="">Aleatória</option></select>
      </div>
      <div class="filter-group">
        <label>Personalidade</label>
        <select id="fPers"><option value="">Aleatória</option></select>
      </div>
      <div class="filter-group">
        <label>Estilo de Jogo</label>
        <select id="fEstilo"><option value="">Aleatório</option></select>
      </div>
      <div class="filter-group">
        <label>Nível</label>
        <select id="fNivel">
          <option value="">Aleatório</option>
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
          <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
          <option>11</option><option>12</option><option>13</option><option>14</option><option>15</option>
          <option>16</option><option>17</option><option>18</option><option>19</option><option>20</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Alinhamento</label>
        <select id="fAlign">
          <option value="">Aleatório</option>
          <option>Leal e Bom</option><option>Neutro e Bom</option><option>Caótico e Bom</option>
          <option>Leal e Neutro</option><option>Neutro</option><option>Caótico e Neutro</option>
          <option>Leal e Mau</option><option>Neutro e Mau</option><option>Caótico e Mau</option>
        </select>
      </div>
      <div class="divider"></div>
      <button class="btn primary gen-btn" onclick="gerar()"><i class="ti ti-dice-5"></i> Gerar Personagem</button>
      <button class="btn gen-btn" style="margin-top:6px" onclick="gerarAleatorio()"><i class="ti ti-refresh"></i> Totalmente Aleatório</button>
    </div>

    <div class="gen-main" id="genMain">
      <div class="result-empty">
        <div class="big">🎲</div>
        <p>Configure os filtros e clique em <strong>Gerar Personagem</strong>, ou use <strong>Totalmente Aleatório</strong> para uma surpresa completa.</p>
      </div>
    </div>

  </div>
</div>

<div class="modal-overlay" id="mSave" style="display:none">
  <div class="modal" style="max-width:400px">
    <h3><i class="ti ti-device-floppy" style="margin-right:6px"></i>Salvar Personagem</h3>
    <div class="form-field">
      <label>Nome</label>
      <input type="text" id="saveName">
    </div>
    <div class="form-field">
      <label>Salvar na Pasta</label>
      <div class="folder-pick">
        <div class="folder-opt" id="fopt_player" onclick="selFolder('player')"><i class="ti ti-user"></i>Jogador</div>
        <div class="folder-opt sel" id="fopt_npc" onclick="selFolder('npc')"><i class="ti ti-masks-theater"></i>NPC</div>
        <div class="folder-opt" id="fopt_monster" onclick="selFolder('monster')"><i class="ti ti-skull"></i>Monstro</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeM('mSave')">Cancelar</button>
      <button class="btn primary" onclick="confirmarSalvar()"><i class="ti ti-check"></i> Salvar</button>
    </div>
  </div>
</div>

<script>
// ── THEME ─────────────────────────────────────────────────────────────────────
let dark = localStorage.getItem('rpg_theme') !== 'light';
function applyTheme(){ document.body.classList.toggle('light',!dark); document.getElementById('themeBtn').textContent=dark?'☀':'🌙'; }
function toggleTheme(){ dark=!dark; localStorage.setItem('rpg_theme',dark?'dark':'light'); applyTheme(); }
applyTheme();

// ── MOBILE MENU ───────────────────────────────────────────────────────────────
function toggleMobMenu(){ document.getElementById('mobNav').classList.toggle('open'); }
function closeMobMenu(){ document.getElementById('mobNav').classList.remove('open'); }
document.addEventListener('click',e=>{
  const nav=document.getElementById('mobNav');
  if(nav&&nav.classList.contains('open')&&!nav.contains(e.target)&&!e.target.closest('#mobMenuBtn')) closeMobMenu();
});

// ── STORAGE ───────────────────────────────────────────────────────────────────
const SK_FICHAS  = 'rpg_fichas_v1';
const SK_CUSTOM  = 'rpg_gerador_custom_v1';
const SK_PRESETS = 'rpg_conteudo_presets_v1';
const SK_ACTIVE_PRESET = 'rpg_active_preset_id_v1';

function loadFichas(){ try{return JSON.parse(localStorage.getItem(SK_FICHAS))||[];}catch(e){return[];} }
function saveFichas(arr){ localStorage.setItem(SK_FICHAS, JSON.stringify(arr)); }
function loadCustom(){ try{return JSON.parse(localStorage.getItem(SK_CUSTOM))||{racas:[],classes:[],profissoes:[],personalidades:[],estilos:[]};}catch(e){return{racas:[],classes:[],profissoes:[],personalidades:[],estilos:[]};} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function closeM(id){ document.getElementById(id).style.display='none'; }

// ── DB STATE & PRESETS FILTER ─────────────────────────────────────────────────
let baseDB = null;
let DB = null;

async function carregarDB(){
  try {
    const res = await fetch('../data/personagens.json');
    baseDB = await res.json();
  } catch(e) {
    baseDB = { racas:[], classes:[], profissoes:[], personalidades:[], estilos:[],
           nomes:{masculinos:[],femininos:[],sobrenomes:[]}, fisicos:[], maneirismos:[] };
    console.warn('personagens.json não encontrado, rodando no modo local vazio.', e);
  }
  reconstruirDB();
}

function reconstruirDB(){
  DB = JSON.parse(JSON.stringify(baseDB));
  
  const custom = loadCustom();
  Object.keys(custom).forEach(cat => { 
    if(DB[cat]) {
      DB[cat] = DB[cat].concat(custom[cat]); 
    } 
  });
  
  popularPresetsSelector();
  popularSelects();
}

// Retorna as categorias respeitando as restrições do preset ativo
function getFilteredCat(cat){
  if(!DB || !DB[cat]) return [];
  
  const activeId = localStorage.getItem(SK_ACTIVE_PRESET) || 'default';
  let presets = [];
  try { presets = JSON.parse(localStorage.getItem(SK_PRESETS)) || []; } catch(e){}
  
  const currentPreset = presets.find(p => p.id === activeId);
  if(currentPreset && currentPreset.blocked && currentPreset.blocked[cat]) {
    return DB[cat].filter(item => !currentPreset.blocked[cat].includes(item.id));
  }
  return DB[cat];
}

// Popula a listagem de presets no topo do painel
function popularPresetsSelector(){
  const selector = document.getElementById('presetSelector');
  if(!selector) return;
  
  // Limpa opções extras mantendo a padrão
  while(selector.options.length > 1) selector.remove(1);
  
  let presets = [];
  try { presets = JSON.parse(localStorage.getItem(SK_PRESETS)) || []; } catch(e){}
  
  presets.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.nome;
    selector.appendChild(opt);
  });
  
  const activeId = localStorage.getItem(SK_ACTIVE_PRESET) || 'default';
  selector.value = activeId;
}

// Chamado ao trocar de preset no combo-box superior
function alterarPresetAtivo(novoId) {
  localStorage.setItem(SK_ACTIVE_PRESET, novoId);
  popularSelects();
  toast("Preset alterado! Filtros atualizados.");
}

// ── POPULAR SELECTS DE FILTRO ─────────────────────────────────────────────────
function popularSelects(){
  const fill=(id,arr)=>{
    const el=document.getElementById(id); if(!el)return;
    const antigoVal = el.value;
    while(el.options.length>1) el.remove(1);
    arr.forEach(item=>{ const o=document.createElement('option'); o.value=item.id; o.textContent=item.nome; el.appendChild(o); });
    
    // Tenta reestabelecer o valor previamente selecionado se ele ainda for válido
    if(antigoVal) el.value = antigoVal;
  };
  fill('fRaca',       getFilteredCat('racas'));
  fill('fClasse',     getFilteredCat('classes'));
  fill('fProf',       getFilteredCat('profissoes'));
  fill('fPers',       getFilteredCat('personalidades'));
  fill('fEstilo',     getFilteredCat('estilos'));
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function rollAttr(){ let r=Array.from({length:4},()=>Math.floor(Math.random()*6)+1); r.sort((a,b)=>a-b); return r.slice(1).reduce((a,b)=>a+b,0); }
function mod(v){ return Math.floor((v-10)/2); }
function fmod(v){ const m=mod(v); return (m>=0?'+':'')+m; }
function pickFrom(selectId, arr){
  const v=document.getElementById(selectId).value;
  return v ? arr.find(x=>x.id===v)||rand(arr) : rand(arr);
}

// ── CURRENT NPC ───────────────────────────────────────────────────────────────
let currentNPC = null;

function gerar(){
  if(!DB||!DB.racas.length){ toast('Banco de dados ainda carregando...'); return; }
  
  const racasF = getFilteredCat('racas');
  const classesF = getFilteredCat('classes');
  const profsF = getFilteredCat('profissoes');
  const persF = getFilteredCat('personalidades');
  const estilosF = getFilteredCat('estilos');

  if(!racasF.length || !classesF.length || !profsF.length || !persF.length || !estilosF.length) {
    toast('Erro: O preset ativo bloqueia todo o conteúdo de alguma categoria!');
    return;
  }

  const raca   = pickFrom('fRaca',   racasF);
  const classe = pickFrom('fClasse', classesF);
  const prof   = pickFrom('fProf',   profsF);
  const pers   = pickFrom('fPers',   persF);
  const estilo = pickFrom('fEstilo', estilosF);
  const nivel  = parseInt(document.getElementById('fNivel').value)  || Math.floor(Math.random()*10)+1;
  const align  = document.getElementById('fAlign').value || rand(['Leal e Bom','Neutro e Bom','Caótico e Bom','Leal e Neutro','Neutro','Caótico e Neutro','Leal e Mau','Neutro e Mau','Caótico e Mau']);
  _montarNPC(raca,classe,prof,pers,estilo,nivel,align);
}

function gerarAleatorio(){
  if(!DB||!DB.racas.length){ toast('Banco de dados ainda carregando...'); return; }
  
  ['fRaca','fClasse','fProf','fPers','fEstilo','fNivel','fAlign'].forEach(id=>document.getElementById(id).value='');
  
  const racasF = getFilteredCat('racas');
  const classesF = getFilteredCat('classes');
  const profsF = getFilteredCat('profissoes');
  const persF = getFilteredCat('personalidades');
  const estilosF = getFilteredCat('estilos');

  if(!racasF.length || !classesF.length || !profsF.length || !persF.length || !estilosF.length) {
    toast('Erro: O preset ativo bloqueia todo o conteúdo de alguma categoria!');
    return;
  }

  const raca   = rand(racasF);
  const classe = rand(classesF);
  const prof   = rand(profsF);
  const pers   = rand(persF);
  const estilo = rand(estilosF);
  const nivel  = Math.floor(Math.random()*10)+1;
  const align  = rand(['Leal e Bom','Neutro e Bom','Caótico e Bom','Leal e Neutro','Neutro','Caótico e Neutro','Leal e Mau','Neutro e Mau','Caótico e Mau']);
  _montarNPC(raca,classe,prof,pers,estilo,nivel,align);
}

function _montarNPC(raca,classe,prof,pers,estilo,nivel,align){
  const genero = Math.random()>.5?'m':'f';
  const nomes  = DB.nomes||{masculinos:['Arik'],femininos:['Lyra'],sobrenomes:['Ferro']};
  const nome   = `${rand(genero==='m'?nomes.masculinos:nomes.femininos)} ${rand(nomes.sobrenomes)}`;
  const fisico = rand(DB.fisicos||['Aparência marcante']);
  const maneirismo = rand(DB.maneirismos||['Hábito peculiar']);

  const attrs={FOR:rollAttr(),DES:rollAttr(),CON:rollAttr(),INT:rollAttr(),SAB:rollAttr(),CAR:rollAttr()};
  const pb = nivel<=4?2:nivel<=8?3:nivel<=12?4:nivel<=16?5:6;
  const hp = Math.max(1,(classe.dadoVida + mod(attrs.CON)) * nivel);
  const ca = 10 + mod(attrs.DES);
  const init = mod(attrs.DES);

  currentNPC={nome,raca,classe,prof,pers,estilo,nivel,align,fisico,maneirismo,attrs,pb,hp,ca,init};
  renderNPC(currentNPC);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderNPC(n){
  const {nome,raca,classe,prof,pers,estilo,nivel,align,fisico,maneirismo,attrs,pb,hp,ca,init}=n;

  const attrHtml=['FOR','DES','CON','INT','SAB','CAR'].map(k=>`
    <div class="attr-mini">
      <div class="attr-mini-lbl">${k}</div>
      <div class="attr-mini-val">${attrs[k]}</div>
      <div class="attr-mini-mod">${fmod(attrs[k])}</div>
    </div>`).join('');

  const persTracos = Array.isArray(pers.tracos)?pers.tracos:[pers.tracos];
  const persIdeais = Array.isArray(pers.ideais)?pers.ideais:[pers.ideais];
  const persVinculos = Array.isArray(pers.vinculos)?pers.vinculos:[pers.vinculos];
  const persDefeitos = Array.isArray(pers.defeitos)?pers.defeitos:[pers.defeitos];

// ── SALVAR ────────────────────────────────────────────────────────────────────
let saveFolder='npc';
function selFolder(f){
  saveFolder=f;
  ['player','npc','monster'].forEach(x=>document.getElementById('fopt_'+x).classList.toggle('sel',x===f));
}
function abrirSalvar(){
  if(!currentNPC){toast('Gere um personagem primeiro!');return;}
  document.getElementById('saveName').value=currentNPC.nome;
  selFolder('npc');
  document.getElementById('mSave').style.display='flex';
  setTimeout(()=>document.getElementById('saveName').focus(),50);
}
function confirmarSalvar(){
  if(!currentNPC)return;
  const n=currentNPC;
  const nome=document.getElementById('saveName').value.trim()||n.nome;
  const fichas=loadFichas();
  const ficha={
    id:uid(), name:nome,
    class:n.classe.nome, race:n.raca.nome, level:n.nivel,
    background:n.prof.nome, alignment:n.align,
    type:saveFolder==='player'?'player':saveFolder==='monster'?'monster':'neutral',
    folder:saveFolder, profBonus:n.pb, xp:0, colors:{},
    attrs:[
      {id:'for',label:'Força',abr:'FOR',val:n.attrs.FOR},
      {id:'des',label:'Destreza',abr:'DES',val:n.attrs.DES},
      {id:'con',label:'Constituição',abr:'CON',val:n.attrs.CON},
      {id:'int',label:'Inteligência',abr:'INT',val:n.attrs.INT},
      {id:'sab',label:'Sabedoria',abr:'SAB',val:n.attrs.SAB},
      {id:'car',label:'Carisma',abr:'CAR',val:n.attrs.CAR},
    ],
    skills:[
      {id:'acr',name:'Acrobacia',attr:'des',prof:0},{id:'arc',name:'Arcanismo',attr:'int',prof:0},
      {id:'ate',name:'Atletismo',attr:'for',prof:0},{id:'eng',name:'Enganação',attr:'car',prof:0},
      {id:'frt',name:'Furtividade',attr:'des',prof:0},{id:'his',name:'História',attr:'int',prof:0},
      {id:'intu',name:'Intuição',attr:'sab',prof:0},{id:'inv',name:'Investigação',attr:'int',prof:0},
      {id:'med',name:'Medicina',attr:'sab',prof:0},{id:'nat',name:'Natureza',attr:'int',prof:0},
      {id:'per',name:'Percepção',attr:'sab',prof:0},{id:'perf',name:'Performance',attr:'car',prof:0},
      {id:'pers',name:'Persuasão',attr:'car',prof:0},{id:'pre',name:'Prestidigitação',attr:'des',prof:0},
      {id:'rel',name:'Religião',attr:'int',prof:0},{id:'sob',name:'Sobrevivência',attr:'sab',prof:0},
    ],
    combat:[
      {id:'ca',label:'CA',val:n.ca},{id:'init',label:'Iniciativa',val:n.init},
      {id:'vel',label:'Velocidade',val:n.raca.velocidade},
      {id:'hpmax',label:'HP Máx',val:n.hp},{id:'hpcur',label:'HP Atual',val:n.hp},
      {id:'hdice',label:'Dado de Vida',val:n.classe.dadoVida},
    ],
    spellSlots:Array.from({length:9},(_,i)=>({level:i+1,total:0,used:0})),
    spells:[],
    habilidades:[
      {id:uid(),name:n.raca.tracoRacial.split(':')[0].trim(),uses:0,level:1,desc:n.raca.tracoRacial,usesSpent:0},
      {id:uid(),name:n.classe.recurso.split('—')[0].trim(),uses:0,level:1,desc:n.classe.recurso,usesSpent:0},
    ],
    equipment:[{name:n.prof.equipamento,cat:'item',weight:1,qty:1,desc:'Equipamento de antecedente.'}],
    traits:Array.isArray(n.pers.tracos)?n.pers.tracos.join(' '):n.pers.tracos,
    ideais:Array.isArray(n.pers.ideais)?n.pers.ideais.join(' '):n.pers.ideais,
    bonds:Array.isArray(n.pers.vinculos)?n.pers.vinculos.join(' '):n.pers.vinculos,
    flaws:Array.isArray(n.pers.defeitos)?n.pers.defeitos.join(' '):n.pers.defeitos,
    backstory:`${n.fisico}. ${n.maneirismo}.`,
    notes:`Estilo de jogo: ${n.estilo.nome}. ${n.estilo.dicas}`
  };
  fichas.push(ficha);
  saveFichas(fichas);
  closeM('mSave');
  toast(`"${nome}" salvo em ${saveFolder==='player'?'Jogadores':saveFolder==='npc'?'NPCs':'Monstros'}!`);
}
