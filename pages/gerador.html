<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de Personagens — RPG System</title>
<link rel="stylesheet" href="../css/base.css">
<style>
body{display:flex;flex-direction:column;min-height:100vh}
#app{display:flex;flex-direction:column;flex:1}

/* ── LAYOUT ─────────────────────────────────────────────────────────────── */
.gen-workspace{display:flex;flex:1;overflow:hidden;height:calc(100vh - 52px)}
.gen-panel{width:300px;flex-shrink:0;border-right:1px solid var(--border);background:#120f0a;overflow-y:auto;padding:16px}
body.light .gen-panel{background:#e0d8c4}
.gen-main{flex:1;overflow-y:auto;padding:24px 28px}

/* ── FILTER PANEL ────────────────────────────────────────────────────────── */
.filter-group{margin-bottom:14px}
.filter-group label{display:block;font-family:'Cinzel',serif;font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.filter-group select,.filter-group input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:4px;font-family:'Crimson Text',serif;font-size:13px}
.filter-group select:focus,.filter-group input:focus{outline:none;border-color:var(--gold)}
.filter-group select option{background:var(--card)}
.gen-btn{width:100%;margin-top:4px;font-size:13px;padding:10px;letter-spacing:2px}
.gen-btn i{font-size:16px;margin-right:6px}

/* ── RESULT CARD ─────────────────────────────────────────────────────────── */
.result-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);font-style:italic;gap:12px}
.result-empty .big{font-size:48px;opacity:0.25}
.result-empty p{font-size:14px;text-align:center;max-width:280px;line-height:1.6}

.npc-sheet{max-width:800px;margin:0 auto}
.npc-header{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px 24px;margin-bottom:16px;display:flex;align-items:center;gap:20px}
.npc-avatar{width:72px;height:72px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:28px;font-weight:700;color:var(--gold);background:rgba(200,168,107,0.08);flex-shrink:0}
.npc-identity{flex:1}
.npc-name{font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:var(--gold2);margin-bottom:4px}
.npc-sub{font-size:14px;color:var(--muted);margin-bottom:6px}
.npc-tags{display:flex;gap:6px;flex-wrap:wrap}
.npc-tag{font-family:'Cinzel',serif;font-size:9px;padding:2px 8px;border-radius:3px;border:1px solid;letter-spacing:0.5px;text-transform:uppercase}
.npc-tag.raca{border-color:var(--blue2);color:var(--blue2)}
.npc-tag.classe{border-color:var(--gold);color:var(--gold)}
.npc-tag.prof{border-color:var(--green2);color:var(--green2)}
.npc-tag.nivel{border-color:var(--muted);color:var(--muted)}

.npc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.npc-sec{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.npc-sec-full{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.npc-sec h3{font-family:'Cinzel',serif;font-size:11px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.npc-sec h3 i{font-size:14px}

/* ATTR ROW */
.attr-row{display:flex;gap:8px;flex-wrap:wrap}
.attr-mini{background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:6px 10px;text-align:center;flex:1;min-width:60px}
.attr-mini-lbl{font-family:'Cinzel',serif;font-size:8px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.attr-mini-val{font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:var(--text)}
.attr-mini-mod{font-size:11px;color:var(--muted);font-family:'Cinzel',serif}

/* TRAIT LIST */
.trait-list{list-style:none;padding:0}
.trait-list li{font-size:13px;color:var(--muted);padding:4px 0 4px 16px;position:relative;line-height:1.5;border-bottom:1px solid rgba(61,51,32,0.3)}
.trait-list li:last-child{border-bottom:none}
.trait-list li::before{content:'◆';position:absolute;left:0;color:var(--border);font-size:8px;top:7px}
.trait-list li strong{color:var(--text)}

/* COMBAT STATS ROW */
.combat-row{display:flex;gap:10px;flex-wrap:wrap}
.cs-box{background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:8px 12px;text-align:center;flex:1;min-width:64px}
.cs-val{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--gold)}
.cs-lbl{font-size:10px;color:var(--muted);font-family:'Cinzel',serif;letter-spacing:0.5px}

/* ACTIONS BAR */
.actions-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;align-items:center}
.actions-bar .btn{flex:1;min-width:120px;text-align:center;justify-content:center}

/* SAVE MODAL extras */
.folder-pick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px}
.folder-opt{padding:10px 6px;border-radius:5px;border:1px solid var(--border);background:var(--card2);cursor:pointer;text-align:center;transition:all 0.15s;font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.5px;color:var(--muted);text-transform:uppercase}
.folder-opt:hover{border-color:var(--gold);color:var(--gold)}
.folder-opt.sel{border-color:var(--gold);color:var(--gold);background:rgba(200,168,107,0.1)}
.folder-opt i{display:block;font-size:20px;margin-bottom:4px}

/* PDF PRINT */
@media print{
  .header,.gen-panel,.actions-bar,.no-print{display:none!important}
  .gen-workspace{height:auto;display:block}
  .gen-main{padding:0}
  .npc-sheet{max-width:100%}
  body{background:#fff;color:#000}
  .npc-header,.npc-sec,.npc-sec-full,.npc-grid{break-inside:avoid}
  :root{--bg:#fff;--card:#f5f5f5;--card2:#ececec;--border:#ccc;--text:#111;--muted:#555;--gold:#6a4e10;--gold2:#4a3000}
}

/* RESPONSIVE */
@media(max-width:700px){
  .gen-workspace{flex-direction:column;height:auto}
  .gen-panel{width:100%;border-right:none;border-bottom:1px solid var(--border)}
  .gen-main{padding:14px 16px}
  .npc-grid{grid-template-columns:1fr}
  .npc-header{flex-direction:column;text-align:center}
  .npc-tags{justify-content:center}
  .actions-bar{flex-direction:column}
  .actions-bar .btn{min-width:0}
  .folder-pick{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app">

  <div class="header">
    <div class="header-brand">
      <i class="ti ti-sparkles header-icon"></i>
      <div><h1>Gerador de Personagens</h1><div class="subtitle">NPCs e Jogadores Aleatórios</div></div>
    </div>
    <div class="header-actions">
      <a href="../index.html"  class="nav-link"><i class="ti ti-home"></i> Início</a>

      <a href="./tracker.html" class="nav-link"><i class="ti ti-sword"></i> Tracker</a>
      <button class="theme-icon-btn" id="themeBtn" onclick="toggleTheme()" title="Alternar tema">☀</button>
    </div>
  </div>

  <div class="gen-workspace">

    <!-- PAINEL DE FILTROS -->
    <div class="gen-panel">
      <div class="panel-title">Filtros</div>

      <div class="filter-group">
        <label>Raça</label>
        <select id="fRaca"><option value="">Aleatória</option></select>
      </div>
      <div class="filter-group">
        <label>Classe</label>
        <select id="fClasse"><option value="">Aleatória</option></select>
      </div>
      <div class="filter-group">
        <label>Profissão / Papel</label>
        <select id="fProf"><option value="">Aleatória</option></select>
      </div>
      <div class="filter-group">
        <label>Estilo de Jogo</label>
        <select id="fEstilo"><option value="">Aleatório</option></select>
      </div>
      <div class="filter-group">
        <label>Nível (1–20)</label>
        <select id="fNivel">
          <option value="">Aleatório</option>
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
          <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
          <option>11</option><option>12</option><option>13</option><option>14</option><option>15</option>
          <option>16</option><option>17</option><option>18</option><option>19</option><option>20</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Alinhamento</label>
        <select id="fAlign">
          <option value="">Aleatório</option>
          <option>Leal e Bom</option><option>Neutro e Bom</option><option>Caótico e Bom</option>
          <option>Leal e Neutro</option><option>Neutro</option><option>Caótico e Neutro</option>
          <option>Leal e Mau</option><option>Neutro e Mau</option><option>Caótico e Mau</option>
        </select>
      </div>

      <div class="divider"></div>

      <button class="btn primary gen-btn" onclick="gerar()">
        <i class="ti ti-dice-5"></i> Gerar Personagem
      </button>
      <button class="btn gen-btn" style="margin-top:8px" onclick="gerarNovamente()">
        <i class="ti ti-refresh"></i> Novo Aleatório
      </button>
    </div>

    <!-- RESULTADO -->
    <div class="gen-main" id="genMain">
      <div class="result-empty">
        <div class="big">🎲</div>
        <p>Configure os filtros ao lado e clique em <strong>Gerar Personagem</strong> para criar um NPC ou personagem aleatório.</p>
      </div>
    </div>

  </div>
</div>

<!-- MODAL: salvar ficha -->
<div class="modal-overlay" id="mSave" style="display:none">
  <div class="modal" style="max-width:400px">
    <h3><i class="ti ti-device-floppy" style="margin-right:6px"></i>Salvar Personagem</h3>
    <div class="form-field">
      <label>Nome (editar se quiser)</label>
      <input type="text" id="saveName">
    </div>
    <div class="form-field">
      <label>Salvar na Pasta</label>
      <div class="folder-pick">
        <div class="folder-opt sel" id="fopt_player" onclick="selFolder('player')">
          <i class="ti ti-user"></i>Jogador
        </div>
        <div class="folder-opt" id="fopt_npc" onclick="selFolder('npc')">
          <i class="ti ti-masks-theater"></i>NPC
        </div>
        <div class="folder-opt" id="fopt_monster" onclick="selFolder('monster')">
          <i class="ti ti-skull"></i>Monstro
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeM('mSave')">Cancelar</button>
      <button class="btn primary" onclick="confirmarSalvar()"><i class="ti ti-check"></i> Salvar</button>
    </div>
  </div>
</div>

<script>

let dark = localStorage.getItem('rpg_theme') !== 'light';
function applyTheme(){ document.body.classList.toggle('light',!dark); document.getElementById('themeBtn').textContent=dark?'☀':'🌙'; }
function toggleTheme(){ dark=!dark; localStorage.setItem('rpg_theme',dark?'dark':'light'); applyTheme(); }
applyTheme();

// ── STORAGE ───────────────────────────────────────────────────────────────────
const SK = 'rpg_fichas_v1';
function loadFichas(){ try{return JSON.parse(localStorage.getItem(SK))||[];}catch(e){return[];} }
function saveFichas(arr){ localStorage.setItem(SK, JSON.stringify(arr)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function closeM(id){ document.getElementById(id).style.display='none'; }

// ── POPULAR SELECTS ────────────────────────────────────────────────────────────
function popularSelects(){
  const fill=(id,arr,labelKey)=>{
    const el=document.getElementById(id);
    arr.forEach(item=>{ const o=document.createElement('option'); o.value=item.id; o.textContent=item[labelKey]; el.appendChild(o); });
  };
  fill('fRaca', DB.racas, 'nome');
  fill('fClasse', DB.classes, 'nome');
  fill('fProf', DB.profissoes, 'nome');
  fill('fEstilo', DB.estilos, 'nome');
}
popularSelects();

// ── UTILS ─────────────────────────────────────────────────────────────────────
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function rollAttr(){ let rolls=Array.from({length:4},()=>Math.floor(Math.random()*6)+1); rolls.sort((a,b)=>a-b); return rolls.slice(1).reduce((a,b)=>a+b,0); }
function mod(v){ return Math.floor((v-10)/2); }
function fmod(v){ const m=mod(v); return (m>=0?'+':'')+m; }
function pick(id,arr,labelKey){ const v=document.getElementById(id).value; return v?arr.find(x=>x.id===v)||rand(arr):rand(arr); }

// ── CURRENT NPC ───────────────────────────────────────────────────────────────
let currentNPC = null;

function gerar(){
  const raca   = pick('fRaca',   DB.racas,     'nome');
  const classe = pick('fClasse', DB.classes,   'nome');
  const prof   = pick('fProf',   DB.profissoes,'nome');
  const estilo = pick('fEstilo', DB.estilos,   'nome');
  const pers   = rand(DB.personalidades);
  const nivel  = parseInt(document.getElementById('fNivel').value)||Math.floor(Math.random()*10)+1;
  const align  = document.getElementById('fAlign').value || rand(['Leal e Bom','Neutro e Bom','Caótico e Bom','Leal e Neutro','Neutro','Caótico e Neutro','Caótico e Mau','Neutro e Mau']);

  const genero = Math.random()>.5?'m':'f';
  const nome   = `${rand(genero==='m'?DB.nomes.masculinos:DB.nomes.femininos)} ${rand(DB.nomes.sobrenomes)}`;
  const fisico = rand(DB.fisicos);
  const maneirismo = rand(DB.maneirismos);

  // roll atributos + bônus racial
  const base={ FOR:rollAttr(),DES:rollAttr(),CON:rollAttr(),INT:rollAttr(),SAB:rollAttr(),CAR:rollAttr() };
  const attrs={};
  ['FOR','DES','CON','INT','SAB','CAR'].forEach(k=>{ attrs[k]=Math.min(20,base[k]+(raca.bônus[k]||0)); });

  const pb = nivel<=4?2:nivel<=8?3:nivel<=12?4:nivel<=16?5:6;
  const hp = (classe.dadoVida + mod(attrs.CON)) * nivel;
  const ca = 10 + mod(attrs.DES);
  const init = mod(attrs.DES);

  currentNPC = { nome, raca, classe, prof, estilo, pers, nivel, align, fisico, maneirismo, attrs, pb, hp, ca, init };
  renderNPC(currentNPC);
}

function gerarNovamente(){
  // ignora filtros, tudo aleatório
  document.getElementById('fRaca').value='';
  document.getElementById('fClasse').value='';
  document.getElementById('fProf').value='';
  document.getElementById('fEstilo').value='';
  document.getElementById('fNivel').value='';
  document.getElementById('fAlign').value='';
  gerar();
}

// ── SALVAR ────────────────────────────────────────────────────────────────────
let saveFolder = 'npc';
function selFolder(f){
  saveFolder=f;
  ['player','npc','monster'].forEach(x=>{
    document.getElementById('fopt_'+x).classList.toggle('sel',x===f);
  });
}
function abrirSalvar(){
  if(!currentNPC){ toast('Gere um personagem primeiro!'); return; }
  document.getElementById('saveName').value=currentNPC.nome;
  selFolder('npc');
  document.getElementById('mSave').style.display='flex';
  setTimeout(()=>document.getElementById('saveName').focus(),50);
}

  if(!currentNPC) return;
  const n=currentNPC;
  const nome=document.getElementById('saveName').value.trim()||n.nome;
  const fichas=loadFichas();

  // montar objeto compatível com ficha.html
  const ficha={
    id:uid(), name:nome,
    class:n.classe.nome, race:n.raca.nome, level:n.nivel,

    attrs:[
